spring.application.name=eureka-server
server.port=8761



# Disable self-registration since this is the registry server itself
eureka.client.register-with-eureka=false

# Disable fetching registry data since it doesn't need to look up other services
eureka.client.fetch-registry=false

# Optional: Logging configuration to keep console clean
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO

# Micrometer Tracing & Zipkin Configuration
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0